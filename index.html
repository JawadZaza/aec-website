<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied Engineering Club — Fullerton College</title>
<meta name="description" content="The student-run Applied Engineering Club at Fullerton College. Events, competitions, officers, and how to join.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/logo/aec-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="announcement-banner" class="hidden"></div>

<header class="site-header">
  <div class="header-inner">
    <a href="#top" class="brand">
      <img id="header-logo" src="assets/images/logo/aec-logo.svg" alt="Applied Engineering Club logo">
      <span id="header-club-name">Applied Engineering Club</span>
    </a>
    <nav class="main-nav" id="main-nav">
      <ul id="main-nav-list"></ul>
    </nav>
    <div class="header-actions">
      <a class="btn btn-navy" id="header-join-btn" href="#section-join">Join</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav"></nav>
</header>

<main id="top">
  <div id="sections-root">
    <div class="section-loading">Loading club content&hellip;</div>
  </div>
</main>

<footer class="site-footer" id="site-footer">
</footer>

<!-- Section templates rendered by JS -->
<template id="tpl-hero">
  <section id="section-hero">
    <div class="container">
      <h1 id="hero-club-name"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="hero-actions">
        <a class="btn btn-gold" id="hero-join-btn" href="#" target="_blank" rel="noopener">Join the Club</a>
        <a class="btn btn-outline" href="#section-events">See Upcoming Events</a>
      </div>
      <div class="hero-socials" id="hero-socials"></div>
    </div>
  </section>
</template>

<template id="tpl-gallery">
  <section id="section-gallery">
    <div class="container">
      <h2 class="section-title">Gallery</h2>
      <p class="section-subtitle">A look at what the club has been building and doing lately.</p>
      <div class="grid grid-3" id="gallery-grid"></div>
    </div>
  </section>
</template>

<template id="tpl-events">
  <section id="section-events">
    <div class="container">
      <h2 class="section-title">Upcoming Events</h2>
      <p class="section-subtitle">Join us at our next meetings, workshops, and build nights.</p>
      <div class="grid grid-3" id="events-grid"></div>
    </div>
  </section>
</template>

<template id="tpl-officers">
  <section id="section-officers">
    <div class="container">
      <h2 class="section-title">Meet the Officers</h2>
      <p class="section-subtitle">The students running the club this year.</p>
      <div class="grid grid-4" id="officers-grid"></div>
    </div>
  </section>
</template>

<template id="tpl-competitions">
  <section id="section-competitions">
    <div class="container">
      <h2 class="section-title">Current Competitions</h2>
      <p class="section-subtitle">What our teams are building toward right now.</p>
      <div class="grid grid-3" id="competitions-grid"></div>
    </div>
  </section>
</template>

<template id="tpl-join">
  <section id="section-join">
    <div class="container">
      <h2 class="section-title">Ready to Join?</h2>
      <p class="section-subtitle">No experience required — just curiosity. Fill out our quick sign-up form to get on the club mailing list.</p>
      <a class="btn btn-gold" id="join-form-btn" href="#" target="_blank" rel="noopener">Apply Now</a>
    </div>
  </section>
</template>

<template id="tpl-meeting-info">
  <section id="section-meeting-info">
    <div class="container">
      <h2 class="section-title">Meeting Info</h2>
      <div class="meeting-card">
        <dl>
          <div>
            <dt>Day</dt>
            <dd id="meeting-day"></dd>
          </div>
          <div>
            <dt>Time</dt>
            <dd id="meeting-time"></dd>
          </div>
          <div>
            <dt>Location</dt>
            <dd id="meeting-location"></dd>
          </div>
        </dl>
        <p class="meeting-note" id="meeting-notes"></p>
      </div>
    </div>
  </section>
</template>

<template id="tpl-socials">
  <section id="section-socials">
    <div class="container">
      <h2 class="section-title">Follow Along</h2>
      <p class="section-subtitle">The fastest way to hear about events and last-minute changes.</p>
      <div class="socials-row" id="socials-row"></div>
    </div>
  </section>
</template>

<script src="assets/js/main.js"></script>
</body>
</html>
